paperproxy:
  command:
    disclaimer: "<red>Kein offizielles Paper-Projekt. PaperProxy steht in keiner Verbindung zu PaperMC."
    based-on: "<gray>Basiert auf Velocity {velocity_version}, lizenziert unter der GNU GPL v3."
    reload-success: "{prefix}<green>Nachrichten neu geladen."
    reload-failure: "{prefix}<red>Die Nachrichten konnten nicht neu geladen werden. Details in der Konsole."
  paperguard:
    key: "<gray>PaperGuard-Schlüssel für <white>{server}</white>:</gray>\n<yellow>{key}</yellow>\n<gray>Trage ihn auf diesem Server in <white>plugins/PaperGuard/config.yml</white> ein, zusammen mit <white>server-name: {server}</white>. Geheim halten."
    rotate-confirm: "<red>Damit wird das PaperGuard-Secret ersetzt. Jedes Backend braucht danach seinen neuen Schlüssel und lehnt bis dahin Logins ab.</red> <gray>Tippe <white>paperproxy paperguard rotate confirm</white>, um fortzufahren."
    rotated: "<green>Neues PaperGuard-Secret erstellt.</green> <gray>Die neuen Schlüssel gibt es mit <white>paperproxy paperguard key [server]</white>."
  maintenance:
    kick: "<red>Das Netzwerk ist in Wartung.</red>\n<gray>Bitte komm später wieder."
    server: "{prefix}<red>{server} ist gerade in Wartung."
    motd: "<red>Wartungsarbeiten</red>\n<gray>Wir sind bald zurück."
    version-label: "Wartung"
    status: "{prefix}<gray>Netzwerk-Wartung: <white>{state}</white>, Server in Wartung: <white>{servers}"
    enabled: "{prefix}<yellow>Wartung aktiviert für <white>{target}</white>."
    disabled: "{prefix}<green>Wartung deaktiviert für <white>{target}</white>."
  versions:
    denied: "{prefix}<red>{server} unterstützt nur Minecraft {versions}. Du nutzt {client_version}."
  health:
    offline: "{prefix}<red>{server} ist gerade offline. Bitte versuche es später erneut."
    down: "{prefix}<red>{server} ist offline gegangen."
    up: "{prefix}<green>{server} ist wieder online."
  alert:
    format: "<dark_gray>[<red>Alarm</red>]</dark_gray> <white>{message}"
  find:
    result: "{prefix}<white>{player}</white> <gray>ist auf</gray> <white>{server}</white>"
    not-online: "{prefix}<red>{player} ist nicht online."
  ip:
    result: "{prefix}<gray>IP von <white>{player}</white>: <white>{ip}"
  servers:
    line: "<white>{server}</white> <dark_gray>|</dark_gray> <gray>{state}</gray> <dark_gray>|</dark_gray> <gray>{players} Spieler</gray> <dark_gray>|</dark_gray> <gray>Forwarding {forwarding}"
  plugin:
    warning: "<gold>Plugin-Reload ist experimentell.</gold>\n<gray>Manche Plugins verhalten sich danach fehlerhaft (doppelte Events, Speicherlecks, kaputte Verbindungen). Bei Problemen den Proxy neu starten. Fehler, die nur nach einem Reload auftreten, bitte nicht beim Plugin-Autor melden.</gray>\n<gray>Tippe <white>/{command}</white>, um fortzufahren."
    working: "{prefix}<gray>Bearbeite <white>{plugin}</white> im Hintergrund..."
    loaded: "{prefix}<green><white>{plugin}</white> geladen ({detail} ms)."
    unloaded: "{prefix}<green><white>{plugin}</white> entladen."
    failed: "{prefix}<red>{plugin} konnte nicht geändert werden: {detail}"
    blocked: "{prefix}<red>{plugin} kann nicht sicher neu geladen werden. Bitte den Proxy neu starten."
    not-found: "{prefix}<red>Kein Plugin namens {plugin} geladen."
    file-not-found: "{prefix}<red>plugins/{plugin} existiert nicht."
    has-dependents: "{prefix}<red>{plugin} wird von {detail} benötigt. Diese zuerst entladen."
    list: "{prefix}<gray>Velocity-Plugins: <white>{velocity}</white>\n<gray>BungeeCord-Plugins: <white>{bungee}</white>\n<gray>Änderungen zur Laufzeit seit Start: <white>{changes}"
  update:
    available: "{prefix}<yellow>PaperProxy {version} ist verfügbar</yellow> <gray>(installiert: {current}).</gray> <aqua>{url}"
    none: "{prefix}<green>PaperProxy ist aktuell."
    downloaded: "{prefix}<gray>Das Update wurde heruntergeladen und geprüft. Es wird beim nächsten Neustart aktiv."
  via:
    working: "{prefix}<gray>Prüfe ViaVersion, ViaBackwards und ViaRewind auf Modrinth..."
    installed: "{prefix}<green><white>{plugin}</white> {detail} installiert."
    updated: "{prefix}<green><white>{plugin}</white> auf {detail} aktualisiert."
    current: "{prefix}<gray><white>{plugin}</white> ist installiert ({detail})."
    failed: "{prefix}<red>{plugin}: {detail}"
    restart: "{prefix}<yellow>Starte den Proxy neu, um die Änderungen zu aktivieren. Via kann nicht im laufenden Betrieb geladen werden."
