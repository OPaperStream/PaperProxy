# PaperProxy messages
#
# Every text the proxy shows to players or in the console can be changed here.
# Formatting: MiniMessage (https://docs.advntr.dev/minimessage/format.html) and legacy
# color codes (&a, &l, &#55ffaa, ...) both work, also mixed.
#
# Placeholders are written in curly braces, e.g. {server}. {prefix} inserts the prefix below.
# Each message only knows the placeholders that are already used in its default text.
#
# Reload without restart: /paperproxy reload
# Missing keys are added automatically after updates; your texts are kept and the old file
# is saved as a backup next to this one.

# When true, players get messages_<language>.yml (e.g. messages_de.yml) if it exists for
# their client language. Keys missing there fall back to this file.
per-client-language: false

prefix: "<gradient:#3ad9cd:#8df3e4>PaperProxy</gradient> <dark_gray>»</dark_gray> "

velocity:
  error:
    already-connected: "You are already connected to this server!"
    already-connected-proxy: "You are already connected to this proxy!"
    already-connecting: "You are already trying to connect to a server!"
    cant-connect: "Unable to connect to {server}: {reason}"
    connecting-server-error: "Unable to connect you to {server}. Please try again later."
    connected-server-error: "Your connection to {server} encountered a problem."
    internal-server-connection-error: "An internal server connection error occurred."
    logging-in-too-fast: "You are logging in too fast, try again later."
    online-mode-only: "You are not logged into your Minecraft account. If you are logged into your Minecraft account, try restarting your Minecraft client."
    player-connection-error: "An internal error occurred in your connection."
    plugin-message-overflow: "You sent too many plugin messages before completing the connection."
    modern-forwarding-needs-new-client: "This server is only compatible with Minecraft 1.13 and above."
    modern-forwarding-failed: "Your server did not send a forwarding request to the proxy. Make sure the server is configured for Velocity forwarding."
    moved-to-new-server: "You were kicked from {server}: {reason}"
    no-available-servers: "There are no available servers to connect you to. Try again later or contact an admin."
    illegal-chat-characters: "Illegal characters in chat"
  command:
    generic-error: "An error occurred while running this command."
    command-does-not-exist: "This command does not exist."
    players-only: "Only players can run this command."
    server-does-not-exist: "The specified server {server} does not exist."
    player-not-found: "The specified player {player} does not exist."
    server-current-server: "You are currently connected to {server}."
    server-too-many: "There are too many servers set up. Use tab completion to view all servers available."
    server-available: "Available servers:"
    server-tooltip-player-online: "{count} player online"
    server-tooltip-players-online: "{count} players online"
    server-tooltip-current-server: "Currently connected to this server"
    server-tooltip-offer-connect-server: "Click to connect to this server"
    glist-player-singular: "{count} player is currently connected to the proxy."
    glist-player-plural: "{count} players are currently connected to the proxy."
    glist-view-all: "To view all players on servers, use /glist all."
    reload-success: "Proxy configuration successfully reloaded."
    reload-failure: "Unable to reload your proxy configuration. Check the console for more details."
    version-copyright: "Copyright 2018-{year} {vendor}. {name} is licensed under the terms of the GNU General Public License v3."
    version-offer-copy-version: "Click to copy version to clipboard"
    no-plugins: "There are no plugins currently installed."
    plugins-list: "Plugins: {plugins}"
    plugin-tooltip-website: "Website: {url}"
    plugin-tooltip-author: "Author: {author}"
    plugin-tooltip-authors: "Authors: {authors}"
    send-usage: "/send <player> <server>"
  kick:
    shutdown: "Proxy shutting down."
    command-rate-limit: "You are sending too many commands too quickly."
    tab-complete-rate-limit: "You are sending too many tab complete requests too quickly."

paperproxy:
  command:
    disclaimer: "<red>Not an official Paper project. PaperProxy is not affiliated with PaperMC."
    based-on: "<gray>Based on Velocity {velocity_version}, licensed under the GNU GPL v3."
    reload-success: "{prefix}<green>Messages reloaded."
    reload-failure: "{prefix}<red>Could not reload the messages. Check the console for details."
  paperguard:
    key: "<gray>PaperGuard key for <white>{server}</white>:</gray>\n<yellow>{key}</yellow>\n<gray>Put it into <white>plugins/PaperGuard/config.yml</white> on that server, with <white>server-name: {server}</white>. Keep it secret."
    rotate-confirm: "<red>This replaces the PaperGuard secret. Every backend needs its new key afterwards and rejects logins until then.</red> <gray>Type <white>paperproxy paperguard rotate confirm</white> to continue."
    rotated: "<green>New PaperGuard secret created.</green> <gray>Get the new keys with <white>paperproxy paperguard key [server]</white>."
  maintenance:
    kick: "<red>The network is in maintenance.</red>\n<gray>Please come back later."
    server: "{prefix}<red>{server} is in maintenance right now."
    motd: "<red>Maintenance</red>\n<gray>We are back soon."
    version-label: "Maintenance"
    status: "{prefix}<gray>Network maintenance: <white>{state}</white>, servers in maintenance: <white>{servers}"
    enabled: "{prefix}<yellow>Maintenance enabled for <white>{target}</white>."
    disabled: "{prefix}<green>Maintenance disabled for <white>{target}</white>."
  versions:
    denied: "{prefix}<red>{server} only supports Minecraft {versions}. You are using {client_version}."
  health:
    offline: "{prefix}<red>{server} is offline right now. Please try again later."
    down: "{prefix}<red>{server} went offline."
    up: "{prefix}<green>{server} is back online."
  queue:
    joined: "{prefix}<yellow>{server} is full or offline.</yellow> <gray>You are <white>#{position}</white> of {total} in the queue and will be connected automatically. <white>/queue leave</white> to leave."
    position: "<gray>Queue for <white>{server}</white>: <yellow>#{position}</yellow> of {total}"
    status: "{prefix}<gray>You are <white>#{position}</white> of {total} in the queue for <white>{server}</white>."
    connecting: "{prefix}<green>Your turn! Connecting you to <white>{server}</white>..."
    left: "{prefix}<gray>You left the queue for <white>{server}</white>."
    not-queued: "{prefix}<gray>You are not in a queue."
    timeout: "{prefix}<red>You waited too long and left the queue for {server}."
    full: "{prefix}<red>{server} is full right now."
    rejoin: "{prefix}<green>{server} is back online. Sending you back..."
  hub:
    already: "{prefix}<gray>You are already there."
    no-server: "{prefix}<red>No server is available right now."
  antibot:
    attack-kick: "<red>The server is under a bot attack right now.</red>\n<gray>Please try again in a minute."
    blocked-name: "<red>This name is not allowed here."
    too-many-accounts: "<red>Too many accounts from your connection</red> <gray>(at most {max})."
    attack-start: "{prefix}<red>Bot attack detected. Only known players can join for now."
    attack-end: "{prefix}<green>Bot attack over. Everyone can join again."
  sync:
    logged-in-elsewhere: "<red>You logged in to the network from another place."
    disabled: "{prefix}<gray>Network sync is off. Enable it in <white>paperproxy.toml</white> under <white>[sync]</white>."
    total: "{prefix}<white>{players}</white> <gray>players on</gray> <white>{proxies}</white> <gray>proxies:"
    line: "<dark_gray>-</dark_gray> <white>{proxy}</white> <dark_gray>|</dark_gray> <gray>{players} players"
  alert:
    format: "<dark_gray>[<red>Alert</red>]</dark_gray> <white>{message}"
  find:
    result-network: "{prefix}<white>{player}</white> <gray>is on</gray> <white>{server}</white> <gray>(proxy <white>{proxy}</white>)"
    result: "{prefix}<white>{player}</white> <gray>is on</gray> <white>{server}</white>"
    not-online: "{prefix}<red>{player} is not online."
  ip:
    result: "{prefix}<gray>IP of <white>{player}</white>: <white>{ip}"
  servers:
    line: "<white>{server}</white> <dark_gray>|</dark_gray> <gray>{state}</gray> <dark_gray>|</dark_gray> <gray>{players} players</gray> <dark_gray>|</dark_gray> <gray>forwarding {forwarding}"
  plugin:
    warning: "<gold>Plugin reload is experimental.</gold>\n<gray>Some plugins misbehave afterwards (duplicate events, memory leaks, broken connections). If problems occur, restart the proxy. Do not report errors that only happen after a reload to the plugin author.</gray>\n<gray>Type <white>/{command}</white> to continue."
    working: "{prefix}<gray>Working on <white>{plugin}</white> in the background..."
    loaded: "{prefix}<green><white>{plugin}</white> loaded ({detail} ms)."
    unloaded: "{prefix}<green><white>{plugin}</white> unloaded."
    failed: "{prefix}<red>{plugin} could not be changed: {detail}"
    blocked: "{prefix}<red>{plugin} cannot be reloaded safely. Please restart the proxy."
    not-found: "{prefix}<red>No plugin named {plugin} is loaded."
    file-not-found: "{prefix}<red>plugins/{plugin} does not exist."
    has-dependents: "{prefix}<red>{plugin} is needed by {detail}. Unload those first."
    list: "{prefix}<gray>Velocity plugins: <white>{velocity}</white>\n<gray>BungeeCord plugins: <white>{bungee}</white>\n<gray>Runtime changes since start: <white>{changes}"
  update:
    available: "{prefix}<yellow>PaperProxy {version} is available</yellow> <gray>(running {current}).</gray> <aqua>{url}"
    none: "{prefix}<green>PaperProxy is up to date."
    downloaded: "{prefix}<gray>The update was downloaded and verified. It becomes active after the next restart."
  via:
    working: "{prefix}<gray>Checking ViaVersion, ViaBackwards and ViaRewind on Modrinth..."
    installed: "{prefix}<green>Installed <white>{plugin}</white> {detail}."
    updated: "{prefix}<green>Updated <white>{plugin}</white> to {detail}."
    current: "{prefix}<gray><white>{plugin}</white> is installed ({detail})."
    failed: "{prefix}<red>{plugin}: {detail}"
    restart: "{prefix}<yellow>Restart the proxy to activate the changes. Via cannot be loaded while the proxy runs."
